# ─────────────────────────────────────────────────────────────────────────────
#  ArtCurve Backend Monorepo — CI
#
#  CI THUẦN: build + test + sinh artifact, dừng ở đó. Không deploy, không chờ
#  production — việc đó thuộc về cd.yml (chạy sau khi CI xanh) và monitor.yml
#  (cron health check định kỳ).
#
#  5 thành phần độc lập, mỗi thành phần một job + một artifact:
#    api           NestJS      → artifact: api-dist (dist/)
#    contracts     Foundry     → artifact: contract-abis (out/ — ABI cho FE/BO)
#    curve-engine  Rust gRPC   → artifact: binary release
#    order-matcher Rust AMQP   → artifact: binary release
#    ws-hub        Go          → artifact: binary
#
#  Path filter: chỉ chạy job của phần có thay đổi.
#  workflow_dispatch: chạy tay từ tab Actions → full regression mọi job.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # chạy tay = full regression mọi thành phần

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Xác định thành phần nào của monorepo có thay đổi ──────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
      curve-engine: ${{ steps.filter.outputs.curve-engine }}
      order-matcher: ${{ steps.filter.outputs.order-matcher }}
      ws-hub: ${{ steps.filter.outputs.ws-hub }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'nest-cli.json'
              - 'eslint.config.mjs'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            curve-engine:
              - 'services/curve-engine/**'
              - '.github/workflows/ci.yml'
            order-matcher:
              - 'services/order-matcher/**'
              - '.github/workflows/ci.yml'
            ws-hub:
              - 'services/ws-hub/**'
              - '.github/workflows/ci.yml'

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    name: API (NestJS)
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci --runInBand --forceExit

      - name: Build
        run: npm run build

      - name: Upload artifact — api-dist
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: dist/
          retention-days: 7

  # ── Smart contracts (Foundry) ──────────────────────────────────────────────
  contracts:
    name: Contracts (Foundry)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # lib/ không track trong git — cài pin đúng version đang dùng ở local
      - name: Install libraries (pinned)
        run: |
          git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.3.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 --branch v5.3.0 https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable lib/openzeppelin-contracts-upgradeable

      - name: Build
        run: forge build

      - name: Test (fuzz 10k runs, seed cố định trong foundry.toml)
        run: forge test -vv

      - name: Upload artifact — contract ABIs
        uses: actions/upload-artifact@v4
        with:
          name: contract-abis
          path: contracts/out/
          retention-days: 7

  # ── Rust: curve-engine (gRPC price engine) ────────────────────────────────
  curve-engine:
    name: curve-engine (Rust)
    needs: changes
    if: needs.changes.outputs.curve-engine == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/curve-engine
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # tonic-build compile proto lúc build → cần protoc
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/curve-engine

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Upload artifact — binary
        uses: actions/upload-artifact@v4
        with:
          name: curve-engine-linux-x64
          path: services/curve-engine/target/release/artcurve-curve-engine
          retention-days: 7

  # ── Rust: order-matcher (AMQP matching engine) ────────────────────────────
  order-matcher:
    name: order-matcher (Rust)
    needs: changes
    if: needs.changes.outputs.order-matcher == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order-matcher
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/order-matcher

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Upload artifact — binary
        uses: actions/upload-artifact@v4
        with:
          name: order-matcher-linux-x64
          path: services/order-matcher/target/release/artcurve-order-matcher
          retention-days: 7

  # ── Go: ws-hub (real-time price hub) ──────────────────────────────────────
  ws-hub:
    name: ws-hub (Go)
    needs: changes
    if: needs.changes.outputs.ws-hub == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ws-hub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/ws-hub/go.mod
          cache-dependency-path: services/ws-hub/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o artcurve-ws-hub .

      - name: Upload artifact — binary
        uses: actions/upload-artifact@v4
        with:
          name: ws-hub-linux-x64
          path: services/ws-hub/artcurve-ws-hub
          retention-days: 7

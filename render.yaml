services:
  # ── NestJS API ────────────────────────────────────────────────────────────
  - type: web
    name: artcurve-be
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        value: wss://artcurve-3el8ft2f.livekit.cloud

  # ── Go WebSocket Hub ──────────────────────────────────────────────────────
  - type: web
    name: artcurve-ws-hub
    runtime: docker
    dockerfilePath: services/ws-hub/Dockerfile
    dockerContext: services/ws-hub
    envVars:
      - key: PORT
        value: "8080"
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://artcurve-fe.vercel.app

  # ── Rust Order Matcher (RabbitMQ consumer) ────────────────────────────────
  - type: worker
    name: artcurve-order-matcher
    runtime: docker
    dockerfilePath: services/order-matcher/Dockerfile
    dockerContext: services/order-matcher
    envVars:
      - key: AMQP_URL
        sync: false

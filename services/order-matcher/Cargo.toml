[package]
name    = "artcurve-order-matcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "order-matcher"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }

# RabbitMQ (AMQP 0-9-1)
lapin       = "2"
deadpool-lapin = "0.12"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Precise decimal arithmetic
rust_decimal        = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Unique IDs for orders
uuid        = { version = "1", features = ["v4", "serde"] }

# Timestamps
chrono      = { version = "0.4", features = ["serde"] }

# Config & env
dotenvy     = "0.15"

# Logging
tracing             = "1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror   = "1"
anyhow      = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

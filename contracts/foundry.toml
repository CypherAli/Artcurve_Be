[profile.default]
src          = "src"
out          = "out"
libs         = ["lib"]
test         = "test"
script       = "script"
solc_version = "0.8.24"
optimizer        = true
optimizer_runs   = 200
evm_version      = "cancun"

# Remappings phải nằm TRONG [profile.default] — dùng array, không dùng map
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"
]

[fuzz]
runs = 10000
seed = "0xdeadbeef"

[invariant]
runs  = 256
depth = 15

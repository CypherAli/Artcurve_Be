# ── ArtCurve Infrastructure Services ─────────────────────────────────────────
# Chay: docker compose up -d
# Dung: docker compose down
# Xoa data: docker compose down -v

services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: artcurve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     artcurve
      POSTGRES_PASSWORD: artcurve
      POSTGRES_DB:       artcurve_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artcurve -d artcurve_db']
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  # Dung cho: Nonce cache, JWT blacklist, Rate limit, Price cache, Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: artcurve_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ClickHouse 24 ─────────────────────────────────────────────────────────
  # Dung cho: OHLCV candles, trade history analytics, volume dashboard
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: artcurve_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface (query bang curl/DBeaver)
      - "9000:9000"   # Native TCP (ClickHouse client)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./src/database/clickhouse:/docker-entrypoint-initdb.d  # auto-run SQL khi khoi dong
    environment:
      CLICKHOUSE_DB:       artcurve_analytics
      CLICKHOUSE_USER:     artcurve
      CLICKHOUSE_PASSWORD: artcurve_ch_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── RabbitMQ 3 ────────────────────────────────────────────────────────────
  # Dung cho: Blockchain event queue, DLQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: artcurve_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (http://localhost:15672 guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── API Server ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artcurve_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:   postgresql://artcurve:artcurve@postgres:5432/artcurve_db
      DB_HOST:        postgres
      REDIS_HOST:     redis
      REDIS_URL:      redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      RABBITMQ_URL:   amqp://guest:guest@rabbitmq:5672
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  rabbitmq_data:
